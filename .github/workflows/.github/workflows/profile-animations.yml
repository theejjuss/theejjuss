name: Generate Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # allows manual runs from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare output directory
        run: mkdir -p dist

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: theejjuss
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: theejjuss

      - name: Move 3D calendar files into the same output folder
        run: cp -r profile-3d-contrib/* dist/

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
